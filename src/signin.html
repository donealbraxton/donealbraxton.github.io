<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Doneal's Deck Builder</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div class="site">
      <div data-layout="header"></div>

      <main class="site-main site-main--narrow">
        <form id="login-form" class="auth-card">
          <p class="hero__kicker">Step 1 · Account</p>
          <h1>Sign in</h1>
          <p class="auth-copy">Open your vault, then jump into the builder.</p>
          <div class="field">
            <label for="inputUser">Username</label>
            <input type="text" id="inputUser" class="form-control" placeholder="Username" required autofocus />
          </div>
          <div class="field">
            <label for="inputPassword">Password</label>
            <input type="password" id="inputPassword" class="form-control" placeholder="Password" required />
          </div>
          <p>
            New here? <a href="/signup.html">Create an account</a>
          </p>
          <p id="auth-status" class="auth-status" role="status"></p>
          <button id="login-form-submit" class="btn btn-primary" type="submit">Sign in and build</button>
        </form>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script type="module" src="/scripts/pages/signin.js"></script>
  </body>
</html>
